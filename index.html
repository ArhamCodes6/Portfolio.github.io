<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Home</title>
    <link rel="stylesheet" href="Home.css" />
    <style>
        nav ul li a.active {
            border-bottom: 3px solid rgb(255, 215, 0); /* Gold underline */
            font-weight: bold;
        }
    </style>
</head>
<body class="fade-out">

<header>
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="Code.html">Code's</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="About.html">About</a></li>
        </ul>
    </nav>
</header>

<section class="intro">
    <h1>Welcome to My Portfolio</h1>
    <p>Discover my work, projects, and more.</p>
</section>

<main>
    <section class="image-container">
        <div class="recipe">
            <img src="recipe.png" alt="Recipe App"> <!-- First image -->
        </div>
    
        <div class="arcane">
            <img src="Arcane.jpeg" alt="Arcane App"> <!-- Second image -->
        </div>
    </section>
    
</main>

<footer class="footer" id="footer">
    <p>© 2025 Qazi Arham. All rights reserved.</p>
</footer>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        document.body.classList.add("fade-out");

        // Highlight current nav item
        const currentPage = window.location.pathname.split("/").pop();
        document.querySelectorAll("nav ul li a").forEach(link => {
            if (link.getAttribute("href") === currentPage) {
                link.classList.add("active");
            }
        });

        // Smooth transition for internal links
        const links = document.querySelectorAll("a[href]");
        links.forEach(link => {
            const href = link.getAttribute("href");
            if (href.startsWith("http") || href.startsWith("#") || link.target === "_blank") return;

            link.addEventListener("click", function(e) {
                e.preventDefault();
                const targetUrl = this.href;

                document.body.classList.remove("fade-out");
                document.body.classList.add("fade");

                setTimeout(() => {
                    window.location.href = targetUrl;
                }, 500);
            });
        });
    });

    // Footer reveal logic (optional)
    document.addEventListener('scroll', function () {
        const footer = document.getElementById('footer');
        const scrollPosition = window.scrollY + window.innerHeight;
        const documentHeight = document.documentElement.scrollHeight;
        const windowHeight = window.innerHeight;

        if (scrollPosition >= documentHeight - windowHeight) {
            footer.style.display = 'block';
        } else {
            footer.style.display = 'none';
        }
    });
</script>

</body>
</html>
