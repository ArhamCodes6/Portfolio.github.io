<!-- Javascript for transition -->
<script>
    document.addEventListener("DOMContentLoaded", () => {
        // Make the body visible once the DOM is ready
        document.body.classList.add("fade-out");

        const links = document.querySelectorAll("a[href]");

        links.forEach(link => {
            // Prevent transition on external links or anchor links
            const href = link.getAttribute("href");
            if (href.startsWith("http") || href.startsWith("#") || link.target === "_blank") return;

            link.addEventListener("click", function(e) {
                e.preventDefault();
                const targetUrl = this.href;

                // Start fade animation
                document.body.classList.remove("fade-out");
                document.body.classList.add("fade");

                // Delay navigation until after animation
                setTimeout(() => {
                    window.location.href = targetUrl;
                }, 500); // Match the CSS transition duration
            });
        });
    });
</script>
